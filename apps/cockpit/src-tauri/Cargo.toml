[package]
name = "cockpit"
version = "0.2.0-alpha.0"
description = "claude-sim Dev Cockpit — Tauri app with live iOS Simulator mirror, click-to-tap, build orchestration, and MCP activity monitor."
authors = ["Thuan Nguyen <huong@dracaena.io>"]
edition = "2021"

[lib]
name = "cockpit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Phase B — axum HTTP + SSE on localhost
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"
parking_lot = "0.12"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
